name: Cold graph review

on:
  push:
    branches:
      - main
      - feat/official-langgraph-runtime-v2
  pull_request:

jobs:
  cold-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e "./runtime[dev]"
      - run: python .claude/scripts/fresh_graph_review.py
