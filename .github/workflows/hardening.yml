name: Runtime hardening (Linux and Windows)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and tests
        run: python -m pip install -e "./runtime[dev]"
      - name: Run full suite including actual process-death recovery and hook tests
        run: python -m pytest -q runtime/tests --junitxml=hardening-results.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-results-${{ matrix.os }}
          path: hardening-results.xml
