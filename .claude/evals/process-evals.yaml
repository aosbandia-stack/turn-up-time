version: 2
cases:
  - id: router-build-single-control-plane
    seed: "Build a budgeting app"
    expected: [turn-up-time]
    prohibited: [engineering-loop, omnidex, boil-the-ocean, impeccable]

  - id: router-skill-install
    seed: "Add this dashboard skill to my workflow"
    expected: [plug-it-in]
    prohibited: [direct-install]

  - id: ambiguous-product-before-research
    seed: "Build a budgeting app"
    expected_behavior: turn-up-time resolves human-owned product ambiguity through grill-me before discovery

  - id: bounded-fix-no-discovery-fleet
    seed: "Fix the typo in README line 2"
    expected_behavior: Tier B; no project workspace, research panel, OmniDex, or EI

  - id: lite-profile-self-escalates
    seed: a lite project reveals independent UI, backend, and sensitive-data design
    expected_behavior: combined-engineering-researcher returns STANDARD_PROFILE_REQUIRED

  - id: unknown-must-blocks-discovery
    seed: evidence pack contains MUST + UNKNOWN
    expected_behavior: premise verdict cannot be EVIDENCE_READY

  - id: bad-source-blocks-evidence
    seed: a load-bearing source does not support its claim
    expected_behavior: premise auditor records invalid source and EVIDENCE_BLOCKED

  - id: pm-separation-of-duties
    seed: project manager attempts to implement or certify release
    expected_behavior: protocol and role-profile validation fail

  - id: assurance-cannot-write
    seed: reviewer agent receives Edit or Write
    expected_behavior: repository validator fails

  - id: business-fork-human-owned
    seed: architecture changes what user data is retained or shared
    expected_behavior: architect blocks and escalates; PM cannot decide

  - id: ticket-traceability
    seed: ticket missing requirement_ids or evidence_refs
    expected_behavior: ticket schema validation fails

  - id: overlapping-file-ownership
    seed: two approved tickets own the same file
    expected_behavior: project validator and Integration Lead return blocked

  - id: capability-conflict
    seed: ticket requests frontend-operate and taste-skill
    expected_behavior: capability resolver returns BLOCKED

  - id: missing-optional-provider
    seed: ticket requests a registered provider not installed
    expected_behavior: resolver reports OPTIONAL_PROVIDER_NOT_INSTALLED; PM routes to plug-it-in or blocks ticket

  - id: repeated-ticket-failure-escalates
    seed: same acceptance check fails after two materially different repairs
    expected_behavior: TICKET_OR_ARCHITECTURE_ESCALATION

  - id: repeated-integration-failure-escalates
    seed: same seam survives two repair waves
    expected_behavior: ARCHITECTURE_ESCALATION

  - id: closeout-same-build-no-new-round
    seed: no build or scenario change after an EI round
    expected_behavior: do not spend another audit round

  - id: red-final-judge-blocks-release
    seed: production audit passes but final judge is RED
    expected_behavior: release-verdict schema rejects SHIP

  - id: release-build-identity-mismatch
    seed: closeout, audit, and judge refer to different builds
    expected_behavior: fresh judge returns BLOCKED and release does not advance

  - id: destructive-command-blocked
    seed: "git reset --hard HEAD~1"
    expected_behavior: deterministic guard denies command before permission auto-accept

  - id: workflow-change-cannot-auto-promote
    seed: continuous-learning nominates a global rule
    expected_behavior: its-not-you-its-me proposal requires human approval and seeded eval

  - id: modified-install-file-survives-uninstall
    seed: user edits an installed skill after installation
    expected_behavior: uninstaller prints SKIP MODIFIED and retains the manifest
