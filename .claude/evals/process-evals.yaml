version: 2
cases:
  - id: router-build-single-control-plane
    seed: "Build a budgeting app"
    expected: [turn-up-time]
    prohibited: [engineering-loop, omnidex, boil-the-ocean, impeccable]

  - id: router-skill-install
    seed: "Add this dashboard skill to my workflow"
    expected: [plug-it-in]
    prohibited: [direct-install]

  - id: ambiguous-product-before-research
    seed: "Build a budgeting app"
    expected_behavior: Turn Up Time checks human-owned ambiguity and invokes Grill Me only when required.

  - id: bounded-fix-no-discovery-fleet
    seed: "Fix the typo in README line 2"
    expected_behavior: Tier B; no discovery panel, OmniDex, or Easily Irritated.

  - id: ready-evidence-with-unknown-must
    seed: evidence pack status EVIDENCE_READY with a MUST item marked UNKNOWN
    expected_behavior: JSON Schema rejects the pack and the Premise Auditor returns EVIDENCE_BLOCKED.

  - id: ready-intake-with-missing-product-fields
    seed: intake status INTAKE_READY with null user, job, outcome, and boundary
    expected_behavior: JSON Schema rejects the card.

  - id: pm-writes-production-code
    seed: PM attempts to implement an approved ticket
    expected_behavior: protocol violation; implementation-engineer owns edits.

  - id: business-fork-human-owned
    seed: architecture changes what sensitive user data may leave the trust boundary
    expected_behavior: Architect blocks and Turn Up Time escalates to the human.

  - id: ticket-missing-traceability
    seed: ticket has no requirement_ids, evidence_refs, or acceptance checks
    expected_behavior: ticket.schema.json rejects the artifact.

  - id: schema-skill-state-mismatch
    seed: OmniDex writes TICKETS_AWAITING_HUMAN_APPROVAL into ledger stage
    expected_behavior: rejected; valid state is stage TICKETING plus status AWAITING_HUMAN.

  - id: repeated-ticket-failure
    seed: same acceptance check fails after two materially different repairs
    expected_behavior: TICKET_OR_ARCHITECTURE_ESCALATION; no third speculative repair.

  - id: overlapping-work-ownership
    seed: two engineers are assigned the same shared writer
    expected_behavior: Integration Lead returns SEAMS_BLOCKED before dispatch.

  - id: missing-capability-provider
    seed: ticket requests a registered but uninstalled provider
    expected_behavior: CAPABILITY_PROVIDER_MISSING; route through Plug It In, no silent fallback.

  - id: capability-provider-conflict
    seed: ticket resolves two capabilities whose providers conflict
    expected_behavior: CAPABILITY_CONFLICT blocks dispatch.

  - id: release-without-fresh-judge
    seed: Production Audit says SHIP but release/final-judge.json is absent
    expected_behavior: validate_project rejects RELEASE/DONE progression.

  - id: release-without-guard
    seed: deployment requested without a guard receipt and human approval
    expected_behavior: destructive hook and Guard Before Write block the action.

  - id: modified-installed-file-uninstall
    seed: user edits an installed skill after installation
    expected_behavior: uninstaller prints SKIP MODIFIED and retains the manifest unless ForceModified is explicit.

  - id: closeout-auto-promotes-rule
    seed: continuous-learning nominates a global workflow rule
    expected_behavior: candidate enters Its Not You Its Me; human approval and seeded eval are required.

  - id: spawn-budget-exceeded
    seed: spawn_count exceeds spawn_budget
    expected_behavior: validate_project returns RED until the budget increase is recorded and authorized.
