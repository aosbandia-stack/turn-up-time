version: 1
capabilities:
  frontend-operate:
    provider: impeccable
    bundled: false
    stage: build
    mode: operate
    consumes: [definition-of-good, frontend-evidence, ticket]
    produces: [frontend-code, ui-receipt]
    conflicts: [taste-skill, ui-ux-pro-max, design-review]
    eval: critical-journey-e2e
    uninstall: remove provider mapping; no product files are deleted

  frontend-marketing:
    provider: impeccable
    bundled: false
    stage: build
    mode: persuade
    consumes: [definition-of-good, frontend-evidence, ticket]
    produces: [frontend-code, ui-receipt]
    conflicts: [ui-ux-pro-max, design-review]
    optional_references: [taste-principles]
    eval: visual-and-conversion-contract
    uninstall: remove provider mapping

  browser-e2e:
    provider: e2e-testing
    bundled: false
    stage: build-and-verification
    consumes: [critical-journeys, running-build]
    produces: [e2e-results, screenshots, trace]
    conflicts: []
    eval: seeded-broken-journey-must-fail
    uninstall: remove provider mapping and project-specific tests only with approval

  ai-regression:
    provider: ai-regression-testing
    bundled: false
    stage: build-and-verification
    consumes: [ai-behavior-contract, test-cases]
    produces: [baseline, regression-report]
    conflicts: []
    eval: known-regression-must-fail
    uninstall: remove provider mapping; preserve baselines

  workflow-evals:
    provider: eval-harness
    bundled: true
    stage: any
    consumes: [behavior-contract]
    produces: [eval-definition, eval-report]
    conflicts: []
    eval: grader-control-must-fail
    uninstall: not removable while core workflow is active

  irreversible-write:
    provider: guard-before-write
    bundled: true
    stage: any
    consumes: [proposed-action]
    produces: [guard-receipt]
    conflicts: []
    eval: missing-backup-must-block
    uninstall: not removable while auto-accept is enabled
